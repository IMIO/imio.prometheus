# Generated from:
# https://github.com/plone/meta/tree/2.x/src/plone/meta/default
# See the inline comments on how to expand/tweak this configuration file
[meta]
template = "default"
commit-id = "2.12.0"

[gitignore]
extra_lines = """
.venv
htmlcov/
.mxdev_cache/
requirements.txt
"""

[tox]
test_matrix = {"6.2" = ["3.14", "3.13", "3.12", "3.11", "3.10"]}
constraints_files = {"6.2" = "https://dist.plone.org/release/6.2.3/constraints.txt"}

[github]
# No "dependencies": z3c.dependencychecker wants the Zope packages (OFS, ZODB,
# Products.GenericSetup, zope.*) declared instead of Products.CMFPlone, and
# reports the optional ZServer / threadframe imports of browser.py.
jobs = [
    "qa",
    "coverage",
    "release_ready",
    "circular",
    ]
